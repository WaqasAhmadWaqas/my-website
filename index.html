<!DOCTYPE html>
<html>
<head>
  <title>Waqas Ki Website</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      background-color: #121212; /* Dark Theme */
      color: white; 
      padding-top: 40px; 
      margin: 0;
    }
    h1 { color: #4CAF50; margin-bottom: 5px; }
    p.subtitle { color: #aaa; font-size: 14px; margin-bottom: 30px; }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
    }

    /* Ad Card Ka Design */
    .ad-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    /* "Ad" ka label */
    .ad-label {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #333;
      color: #ccc;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .ad-card h3 {
      margin: 0 0 10px 0;
      color: #fff;
      font-size: 18px;
    }

    .ad-card p {
      color: #bbb;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    /* Ad Button */
    .ad-btn {
      display: block;
      width: 100%;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      color: white;
      padding: 12px;
      text-decoration: none;
      font-size: 16px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
      transition: 0.3s;
    }

    .ad-btn:hover {
      background: linear-gradient(90deg, #ff4b2b, #ff416c);
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Assalam o Alaikum!</h1>
    <p class="subtitle">Welcome to my website</p>

    <!-- 🟢 AD CARD 1 🟢 -->
    <div class="ad-card">
      <span class="ad-label">Sponsored</span>
      <h3>🔥 Exclusive Offers!</h3>
      <p>Click here to unlock special rewards and premium content. Limited time offer!</p>
      <!-- Yahan apna Smartlink dalein -->
      <a href="https://araplhn.org/4/915d01ef995e77cfa2f0a1cc58781089" class="ad-btn" target="_blank" rel="nofollow">
        Claim Now ➔
      </a>
    </div>

    <!-- 🟢 AD CARD 2 🟢 -->
    <div class="ad-card">
      <span class="ad-label">Sponsored</span>
      <h3>🎁 Daily Prizes</h3>
      <p>Spin the wheel and win amazing prizes today. Don't miss out!</p>
      <!-- Yahan apna doosra Smartlink dalein -->
      <a href="https://uplcm.com/4/12210216" class="ad-btn" target="_blank" rel="nofollow">
        Play Now ➔
      </a>
    </div>

  </div>

</body>
</html>
